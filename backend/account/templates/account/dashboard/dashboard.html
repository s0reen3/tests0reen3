{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <i class="fa-solid fa-circle-user fa-5x text-muted"></i>
                    <h4 class="mt-3">{{ user.username }}</h4>
                    <p class="text-muted">{{ user.email }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5>Мой кабинет</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <h6>Заказы</h6>
                                    <p class="text-muted">История ваших заказов</p>
                                    <a href="#" class="btn btn-outline-primary btn-sm">Перейти</a>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <h6>Профиль</h6>
                                    <p class="text-muted">Изменить данные</p>
                                    <a href="#" class="btn btn-outline-primary btn-sm">Изменить</a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12">
                            <a href="{% url 'account:logout' %}" class="btn btn-danger btn-sm">Выйти</a>
                            <a href="{% url 'shop:products' %}" class="btn btn-secondary btn-sm">На главную</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
