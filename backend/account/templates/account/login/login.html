{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Вход</h2>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-success mt-3">Войти</button>
            </form>
            <p class="mt-3">Нет аккаунта? <a href="{% url 'account:register' %}">Зарегистрироваться</a></p>
        </div>
    </div>
</div>
{% endblock %}
