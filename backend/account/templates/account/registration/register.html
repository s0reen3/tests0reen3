{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Регистрация</h2>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-success">Зарегистрироваться</button>
            </form>
            <p class="mt-3">Уже есть аккаунт? <a href="{% url 'account:login' %}">Войти</a></p>
        </div>
    </div>
</div>
{% endblock %}
